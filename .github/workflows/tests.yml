name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      PYTHONPATH: common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check common tests mac/codex_status_server/server.py win/codex_status_server/server.py
      - run: python -m ruff format --check common tests mac/codex_status_server/server.py win/codex_status_server/server.py
      - run: python -m unittest discover -s tests -v
