name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13", "3.14"]
    env:
      PYTHONPATH: common
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check common tests mac/codex_status_server/.internal/server.py win/codex_status_server/.internal/server.py
      - run: python -m ruff format --check common tests mac/codex_status_server/.internal/server.py win/codex_status_server/.internal/server.py
      - name: Run isolated tests
        env:
          CODEX_STATUS_BASE_DIR: ${{ runner.temp }}/trafficlight-tests/runtime
          CODEX_HOME: ${{ runner.temp }}/trafficlight-tests/codex
        run: python -m unittest discover -s tests -v
