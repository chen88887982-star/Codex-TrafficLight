[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!SetVariable CurrentStatus "idle"][!SetVariable CurrentMessage "#DefaultMessage#"][!HideMeterGroup StatusLights][!ShowMeter MeterIdleLight][!SetOption MeterStatusText Text "空闲"][!UpdateMeter *][!Redraw]

[Metadata]
Name=Codex Traffic Light
Author=Codex
Information=Displays Codex run status from a LAN HTTP JSON endpoint.
Version=0.1.0
License=MIT

@Include=#@#variables.inc

[MeasureStatusParent]
Measure=WebParser
URL=#StatusUrl#
RegExp=(?siU)"status"\s*:\s*"([^"]*)".*"message"\s*:\s*"([^"]*)".*"updated_at"\s*:\s*"([^"]*)"
UpdateRate=#UpdateInterval#
UserAgent=Rainmeter CodexTrafficLight/0.1
FinishAction=[!UpdateMeasureGroup StatusParsers][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetVariable CurrentStatus "error"][!SetVariable CurrentMessage "连接状态服务失败"][!HideMeterGroup StatusLights][!ShowMeter MeterErrorLight][!SetOption MeterStatusText Text "连接失败"][!SetOption MeterMessageText Text "#CurrentMessage#"][!UpdateMeter *][!Redraw]
OnRegExpErrorAction=[!SetVariable CurrentStatus "error"][!SetVariable CurrentMessage "状态接口返回格式异常"][!HideMeterGroup StatusLights][!ShowMeter MeterErrorLight][!SetOption MeterStatusText Text "格式异常"][!SetOption MeterMessageText Text "#CurrentMessage#"][!UpdateMeter *][!Redraw]
DynamicVariables=1

[MeasureStatusIdle]
Measure=WebParser
URL=[MeasureStatusParent]
StringIndex=1
Group=StatusParsers
IfMatch=^idle$
IfMatchAction=[!SetVariable CurrentStatus "idle"][!HideMeterGroup StatusLights][!ShowMeter MeterIdleLight][!SetOption MeterStatusText Text "空闲"][!UpdateMeasure MeasureMessage][!SetOption MeterMessageText Text "[MeasureMessage]"][!UpdateMeter *][!Redraw]

[MeasureStatusRunning]
Measure=WebParser
URL=[MeasureStatusParent]
StringIndex=1
Group=StatusParsers
IfMatch=^running$
IfMatchAction=[!SetVariable CurrentStatus "running"][!HideMeterGroup StatusLights][!ShowMeter MeterRunningLight][!SetOption MeterStatusText Text "运行中"][!UpdateMeasure MeasureMessage][!SetOption MeterMessageText Text "[MeasureMessage]"][!UpdateMeter *][!Redraw]

[MeasureStatusWaiting]
Measure=WebParser
URL=[MeasureStatusParent]
StringIndex=1
Group=StatusParsers
IfMatch=^waiting$
IfMatchAction=[!SetVariable CurrentStatus "waiting"][!HideMeterGroup StatusLights][!ShowMeter MeterWaitingLight][!SetOption MeterStatusText Text "等待确认"][!UpdateMeasure MeasureMessage][!SetOption MeterMessageText Text "[MeasureMessage]"][!UpdateMeter *][!Redraw]

[MeasureStatusSuccess]
Measure=WebParser
URL=[MeasureStatusParent]
StringIndex=1
Group=StatusParsers
IfMatch=^success$
IfMatchAction=[!SetVariable CurrentStatus "success"][!HideMeterGroup StatusLights][!ShowMeter MeterSuccessLight][!SetOption MeterStatusText Text "已完成"][!UpdateMeasure MeasureMessage][!SetOption MeterMessageText Text "[MeasureMessage]"][!UpdateMeter *][!Redraw]

[MeasureStatusError]
Measure=WebParser
URL=[MeasureStatusParent]
StringIndex=1
Group=StatusParsers
IfMatch=^error$
IfMatchAction=[!SetVariable CurrentStatus "error"][!HideMeterGroup StatusLights][!ShowMeter MeterErrorLight][!SetOption MeterStatusText Text "异常"][!UpdateMeasure MeasureMessage][!SetOption MeterMessageText Text "[MeasureMessage]"][!UpdateMeter *][!Redraw]

[MeasureMessage]
Measure=WebParser
URL=[MeasureStatusParent]
StringIndex=2
Substitute="":"#DefaultMessage#"

[MeasureUpdatedAt]
Measure=WebParser
URL=[MeasureStatusParent]
StringIndex=3
Substitute="":"未更新"

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#SkinWidth#,#SkinHeight#,#CornerRadius# | Fill Color #BackgroundColor# | StrokeWidth 1 | Stroke Color #PanelStrokeColor#
DynamicVariables=1

[MeterTitle]
Meter=String
X=20
Y=16
W=130
H=24
FontFace=Segoe UI
FontSize=14
FontWeight=600
FontColor=#TextColor#
AntiAlias=1
Text=#TitleText#
DynamicVariables=1

[MeterStatusText]
Meter=String
X=20
Y=42
W=130
H=22
FontFace=Segoe UI
FontSize=10
FontColor=#MutedTextColor#
AntiAlias=1
ClipString=1
Text=空闲

[MeterHousing]
